<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel · Rossignoli Locações</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#121212;--ink-2:#1C1B1A;--paper:#F4F1EC;--paper-2:#FBFAF7;--line:#DCD6CD;--orange:#CE581A;--orange-deep:#A8440F;--mute:#6E6861;--ok:#2F7D4F;--bad:#B3261E;--warn:#9A6A00;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;margin:0;line-height:1}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--ink)}
.login form{background:var(--paper-2);padding:28px;border-radius:6px;width:100%;max-width:360px;display:grid;gap:12px}
.login h1{font-size:30px}.login h1 span{color:var(--orange)}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
/* app */
header{background:var(--ink);color:#F4F1EC;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px}
.top h1{font-size:20px;letter-spacing:.04em}.top h1 span{color:var(--orange)}
.top .who{margin-left:auto;font-size:13px;color:#CFC8BE}
.top button{background:none;border:1px solid #3A3734;color:#CFC8BE;border-radius:4px;padding:4px 10px;cursor:pointer}
nav.tabs{display:flex;gap:0;overflow-x:auto;padding:0 8px;scrollbar-width:none}
nav.tabs .tg{display:flex;flex-direction:column;padding:0 6px;border-left:1px solid #2F2C29}
nav.tabs .tg:first-child{border-left:0}
nav.tabs .tg>span{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8A837B;padding:6px 6px 0}
nav.tabs .tg>div{display:flex;gap:2px}
nav.tabs button{background:none;border:0;color:#CFC8BE;padding:4px 8px 9px;cursor:pointer;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-color:var(--orange)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar h2{font-size:26px;margin-right:auto}
.in,select.in,textarea.in{border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 10px;min-height:38px;width:100%}
.bar .in{width:auto;min-width:140px}
.btn{background:var(--orange);color:#fff;border:0;border-radius:4px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--orange-deep)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:#fff;color:var(--bad);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:34px;line-height:1}
.kpi small{color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:8px;letter-spacing:.03em}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--ink);background:var(--paper-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:#FBEDE4}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--paper);white-space:nowrap}
.p-novo,.p-a_contatar,.p-monitorar{background:#FDE7DA;color:var(--orange-deep)}
.p-fechado,.p-cliente,.p-ganha{background:#DFF0E5;color:var(--ok)}
.estrela{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:0 4px 0 0;color:#C9C2B8;vertical-align:-1px}.estrela.on{color:#E0A100}
.pill.tag{background:#E8EEF7;color:#2F4A6D;font-weight:500}.pill.tag i{cursor:pointer;font-style:normal;margin-left:4px;opacity:.6}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}.chipsel label{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;font-size:13px;cursor:pointer}
.chipsel input{display:none}.chipsel label:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
.rel h3{margin:0 0 8px}.rel .kpi small i{font-style:normal}.sobe{color:var(--ok)}.desce{color:var(--bad)}
.alerta{border-left:4px solid var(--bad)}.dica{font-size:12px;color:var(--mute);margin-top:6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.cols2{grid-template-columns:1fr}}
@media print{header,.noprint,#pedRap{display:none!important}body{background:#fff}.card{break-inside:avoid}}
.p-descartada{background:#ECE8E1;color:#6B655E}
.p-ok{background:#DFF0E5;color:var(--ok)}
.massa{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--ink);color:#fff;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.massa .in{width:auto;min-height:32px;padding:4px 8px}.massa .btn{padding:5px 10px}
th.sort{cursor:pointer}th.sort:hover{color:var(--orange-deep)}
td.ck,th.ck{width:28px;padding-right:0}td.ck input,th.ck input{width:17px;height:17px;cursor:pointer}
.pag{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.p-perdido,.p-sem_interesse,.p-perdida{background:#F6DEDC;color:var(--bad)}
.p-A{background:var(--ink);color:#fff}
.mute{color:var(--mute)}.small{font-size:13px}
.late{color:var(--bad);font-weight:600}
.p-a_fazer{background:#ECE8E1;color:#4A4540}.p-fazendo{background:#FDE7DA;color:var(--orange-deep)}.p-bloqueada{background:#F6DEDC;color:var(--bad)}.p-feita{background:#DFF0E5;color:var(--ok)}
.grp{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--orange-deep);background:var(--paper-2)}
.count{color:var(--mute);font-size:13px;margin:6px 2px}
/* drawer */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper-2);z-index:21;overflow:auto;padding:18px 18px 90px;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
.drawer h2{font-size:24px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.grid .full{grid-column:1/-1}
label.f{display:grid;gap:3px;font-size:13px;color:var(--mute)}
label.f .in{color:var(--ink);font-size:15px}
.actions{position:fixed;bottom:0;right:0;width:min(520px,100%);background:var(--paper-2);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;z-index:22}
.hist{margin-top:16px}.hist li{margin-bottom:6px}
.bars{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.brow i{display:block;height:12px;background:var(--orange);border-radius:0 4px 4px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:4px;z-index:30}
/* trabalho com leads */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--orange)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip b{font-weight:700;margin-left:3px}
.res{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.res.pede{background:#FDF3EC;border-radius:4px;padding:8px}
.res .in{width:auto;min-height:32px;padding:4px 8px}
.card.feito{opacity:.45}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:120px;max-width:260px}
.prog i{display:block;height:100%;background:var(--ok)}
.aviso{background:#FFF6DB;border:1px solid #EBD89A;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.card.pedido{border-left:4px solid var(--orange)}
details.ed{margin-top:16px}details.ed summary{cursor:pointer;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.brow{grid-template-columns:100px 1fr 32px}}
</style>
</head>
<body>

<section class="login" id="login">
  <form id="fLogin">
    <h1>Rossignoli <span>Painel</span></h1>
    <label class="f">Usuário<input class="in" name="u" autocomplete="username" required autocapitalize="none"></label>
    <label class="f">Senha<input class="in" name="s" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Entrar</button>
    <div class="err" id="lErr"></div>
  </form>
</section>

<div id="app" class="hide">
  <header>
    <div class="top"><h1>Rossignoli <span>Painel</span></h1><button class="btn" id="pedRap" style="margin-left:auto;padding:5px 12px" title="Registrar pedido que chegou por WhatsApp, telefone ou indicação">+ Pedido</button><span class="who" id="who" style="margin-left:0"></span><button id="sair">Sair</button></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://vllghkaymxzlfprcvfmc.supabase.co','sb_publishable_HqfLoJbcH5yfYkej7hDeGA_a8_Is3-p');
const DOM = '@rossignolilocacoes.com.br';
const $ = s => document.querySelector(s);
const esc = v => v==null ? '' : String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl = v => v==null||v==='' ? '' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt = v => v ? new Date(v.length<=10 ? v+'T12:00' : v).toLocaleDateString('pt-BR') : '';
const dth = v => v ? new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '';
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hoje = () => iso(new Date());
const diaUtil = n => { const d=new Date(); let k=0; while(k<n){ d.setDate(d.getDate()+1); if(d.getDay()%6) k++; } return iso(d); };
const duracao = (a,b) => { const m=Math.max(0,Math.round((new Date(b)-new Date(a))/6e4)); return m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'; };
const idade = t => duracao(t,Date.now());
const horaComercial = () => { const d=new Date(), h=d.getHours(); return d.getDay()%6!==0 && h>=8 && h<18; };
const saudacao = () => { const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; };
const dig = t => String(t||'').replace(/\D/g,'');
const ehCel = t => /^\d{2}9\d{8}$/.test(dig(t));
let EU = '';
let PAPEL = 'equipe';   // 'admin' libera as áreas exclusivas do dono
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
const pill = (v,lab) => v ? `<span class="pill p-${esc(v)}">${esc(lab||v.replace(/_/g,' '))}</span>` : '';

/* ---------- Opções ---------- */
const OP = {
  pedido_status:[['novo','Novo'],['em_orcamento','Em orçamento'],['orcado','Orçado'],['fechado','Fechado'],['perdido','Perdido']],
  origem:[['whatsapp_direto','WhatsApp direto'],['telefone','Telefone'],['indicacao','Indicação'],['cliente_antigo','Cliente que voltou'],['google_perfil','Perfil do Google'],['site','Site'],['instagram','Instagram'],['prospeccao','Prospecção (Fila)'],['licitacao','Licitação'],['parceiro','Parceiro'],['olx','OLX'],['outro','Outro']],
  conta_status:[['a_contatar','A contatar'],['contatado','Contatado'],['proposta','Proposta enviada'],['cliente','Cliente'],['sem_interesse','Sem interesse'],['descartada','Descartada']],
  descarte:[['fora_perfil','Fora do perfil (não usa içamento)'],['duplicada','Duplicada'],['fechada','Empresa fechada'],['longe','Fora da região'],['sem_contato','Sem contato depois de várias tentativas'],['outro','Outro motivo']],
  equipe:[],
  tipo_conta:[['empresa','Empresa'],['parceiro','Parceiro'],['orgao_publico','Órgão público'],['concorrente','Concorrente']],
  prioridade:[['A','A'],['B','B'],['C','C']],
  atividade:[['ligacao','Ligação'],['whatsapp','WhatsApp'],['visita','Visita'],['email','E-mail'],['proposta','Proposta'],['outro','Outro']],
  lic_status:[['monitorar','Monitorar'],['preparar','Preparar'],['enviada','Proposta enviada'],['ganha','Ganha'],['perdida','Perdida'],['encerrada','Encerrada']],
  equip:[['munck','Munck'],['cesto','Cesto aéreo'],['munck+cesto','Munck + cesto']],
  lic_tipo:[['licitacao','Licitação'],['contrato_em_execucao','Contrato em execução (subcontratação)'],['referencia','Referência / histórico']],
  canal:[['whatsapp','WhatsApp'],['ligacao','Ligação'],['visita','Visita'],['email','E-mail']],
  vale:[['sim','Sim'],['talvez','Talvez'],['nao','Não']],
  tarefa_status:[['a_fazer','A fazer'],['fazendo','Fazendo'],['bloqueada','Bloqueada'],['feita','Feita']]
};
const lab = (k,v) => (OP[k].find(o=>o[0]===v)||[,v])[1];

/* ---------- Contato com um clique: canal + resultado ---------- */
const RES = {decisor:'Passou o decisor',enviado:'Mensagem enviada',nao_atendeu:'Não atendeu',interessado:'Tem interesse',proposta:'Orçamento enviado',retorno:'Pediu retorno',numero_errado:'Número errado',sem_interesse:'Sem interesse',cliente:'Fechou serviço'};
// Sugestão de quem decide a contratação de içamento em cada segmento (o telefone do Maps costuma ser recepção/vendas)
const QUEM_DECIDE = {
  'Construtoras e obras':'engenheiro ou mestre de obras (pede o serviço) e compras/suprimentos (fecha o preço)',
  'Pré-moldados':'gerente de produção ou de expedição; em fábrica pequena, o dono',
  'Estruturas metálicas':'encarregado de montagem ou o dono',
  'Energia solar':'coordenador de instalação ou o dono',
  'Café: cooperativas, armazéns e exportadoras':'gerente do armazém ou da manutenção',
  'Poda de árvores':'o dono ou o encarregado das equipes',
  'Elétrica, iluminação e subestações':'engenheiro ou encarregado de campo',
  'Indústrias':'manutenção industrial ou compras',
  'Metalurgia e manutenção industrial':'encarregado de manutenção ou o dono',
  'Contêiner e andaimes':'o dono ou quem cuida das entregas',
  "Piscinas e caixas d'água":'o dono ou quem cuida da instalação/entrega',
  'Material de construção':'gerente da loja ou responsável pelas entregas',
  'Máquinas agrícolas e industriais':'gerente de pós-venda/entregas ou o dono',
  'Postos de combustível':'o dono ou o gerente do posto (a reforma costuma ser tocada pela distribuidora ou por uma instaladora)',
  'Loteamentos e incorporadoras':'o sócio da incorporadora ou o engenheiro da construtora que faz a infraestrutura'};
const quemDecide = c => QUEM_DECIDE[c.segmento] || 'quem contrata frete e içamento (em empresa pequena, normalmente o dono)';
const fone = c => c.decisor_telefone || c.telefone;
const msgRecepcao = c => `${saudacao()}! Aqui é da Rossignoli Locações, de Varginha: caminhão munck com operador e cesto aéreo. Quem aí na ${c.nome.split(/ [-–|(]/)[0]} cuida da contratação de içamento ou frete de carga pesada? Pode me passar o nome e o contato dessa pessoa? Obrigado!`;
let MODS = null;
async function carregaModelos(){ if(!MODS){ const {data}=await sb.from('modelos_mensagem').select('*').eq('ativo',true); MODS=data||[]; } return MODS; }
const modeloPara = c => { const et=Math.min((c.etapa||0)+1,5); return (MODS||[]).find(x=>x.etapa===et&&x.segmento===c.segmento)||(MODS||[]).find(x=>x.etapa===et&&!x.segmento)||null; };
function preenche(txt,c){ const motivo=(c.por_que_precisa||'serviços de içamento').split(/[:;.]/)[0].toLowerCase();
  return txt.replace(/\{empresa\}/g,c.nome.split(/ [-–|(]/)[0]).replace(/\{cidade\}/g,c.cidade&&!/Região|\//.test(c.cidade)?c.cidade:'Varginha e região').replace(/\{motivo\}/g,motivo); }
function blocoContato(c,aberto){
  const md=modeloPara(c), tel=fone(c), comDecisor=!!c.decisor_nome;
  const txt=comDecisor&&md?preenche(md.texto,c).replace(/^(Ol[áa]|Bom dia|Boa tarde)[^!,.]*[!,.]/i,`$1, ${c.decisor_nome.split(' ')[0]}!`):msgRecepcao(c);
  return `<div data-ctt>
    <p class="small" style="margin:0 0 6px">${comDecisor?`<b>Decisor:</b> ${esc(c.decisor_nome)}${c.decisor_cargo?' · '+esc(c.decisor_cargo):''}${c.decisor_telefone?'':' <span class="mute">(sem telefone direto: pedir na recepção)</span>'}`:`<b>Objetivo deste contato:</b> achar quem decide — provável: ${esc(quemDecide(c))}. <span class="mute">O número do Maps costuma ser recepção/vendas.</span>`}</p>
    ${tel?`<textarea class="in small" rows="4" data-msg>${esc(txt)}</textarea>`:''}
    <div class="bar" style="margin:8px 0 0">
      ${ehCel(tel)?`<button class="btn" data-a="wa">WhatsApp${horaComercial()?'':' (fora do horário)'}</button>`:''}
      ${tel?`<a class="btn sec" href="tel:${dig(tel)}" data-a="tel">Ligar ${esc(tel)}${c.decisor_telefone?' (direto)':''}</a>`:'<span class="late small">Sem telefone: pesquisar no Maps antes</span>'}
      ${aberto?'':'<button class="btn sec" data-a="res">Registrar resultado ▾</button>'}
    </div>
    <div class="res${aberto?'':' hide'}" data-res><span class="small mute">Como foi?</span>
      ${['decisor','nao_atendeu','interessado','proposta','retorno','sem_interesse','numero_errado','cliente'].map(r=>`<button class="chip" data-r="${r}">${RES[r]}</button>`).join('')}
      <span class="hide" data-dec style="display:flex;gap:6px;flex-wrap:wrap;width:100%"><input class="in" data-dn placeholder="Nome do decisor" value="${esc(c.decisor_nome||'')}"><input class="in" data-dc placeholder="Cargo" value="${esc(c.decisor_cargo||'')}"><input class="in" data-dt placeholder="Telefone direto" value="${esc(c.decisor_telefone||'')}"></span>
      <input type="date" class="in hide" data-ret><input class="in small" data-nota placeholder="Anotação (opcional)" style="flex:1;min-width:160px">
    </div></div>`;
}
// Liga os botões de um bloco de contato. feito(r) é chamado depois de registrar.
function ligaContato(root,c,feito){
  let canal=null; const md=modeloPara(c);
  const reg=async(tipo,resultado,resumo,retorno_em)=>{
    const {error}=await sb.from('atividades').insert({conta_id:c.id,tipo,resultado,resumo,retorno_em:retorno_em||null});
    if(error){ toast('Erro: '+error.message); return false; } toast(RES[resultado]+' · próximo passo agendado'); feito&&feito(resultado); return true; };
  root.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a],[data-r]'); if(!a||!root.contains(a)) return;
    const res=root.querySelector('[data-res]'), nota=root.querySelector('[data-nota]'), ret=root.querySelector('[data-ret]');
    if(a.dataset.a==='wa'){ const t=root.querySelector('[data-msg]');
      window.open('https://wa.me/55'+dig(fone(c))+(t?'?text='+encodeURIComponent(t.value):''),'_blank'); canal='whatsapp';
      await reg('whatsapp','enviado',(md?md.nome:'Mensagem')+' (etapa '+((c.etapa||0)+1)+')'); return; }
    if(a.dataset.a==='tel'){ canal='ligacao'; res.classList.remove('hide'); res.classList.add('pede'); return; }   // o resultado da ligação vem nos botões abaixo
    if(a.dataset.a==='res'){ res.classList.toggle('hide'); return; }
    const r=a.dataset.r;
    if(r==='decisor'){ const box=root.querySelector('[data-dec]');
      if(box.classList.contains('hide')){ box.classList.remove('hide'); a.textContent='Salvar decisor'; box.querySelector('[data-dn]').focus(); return; }
      const dn=box.querySelector('[data-dn]').value.trim(), dc=box.querySelector('[data-dc]').value.trim(), dt_=box.querySelector('[data-dt]').value.trim();
      if(!dn) return toast('Coloque ao menos o nome do decisor');
      const {error}=await sb.from('contas').update({decisor_nome:dn,decisor_cargo:dc||null,decisor_telefone:dt_||null}).eq('id',c.id); if(error) return toast('Erro: '+error.message);
      Object.assign(c,{decisor_nome:dn,decisor_cargo:dc||null,decisor_telefone:dt_||null});
      const ok=await reg(canal||(ehCel(c.telefone)?'whatsapp':'ligacao'),'decisor',`Decisor: ${dn}${dc?' ('+dc+')':''}${dt_?' · '+dt_:''}`);
      if(ok){ const blk=root.querySelector('[data-ctt]'); blk.outerHTML=blocoContato(c,true); } return; }
    if(r==='retorno'&&ret.classList.contains('hide')){ ret.classList.remove('hide'); ret.value=diaUtil(5); a.textContent='Confirmar retorno'; ret.focus(); return; }
    if(r==='sem_interesse'&&!confirm('Marcar '+c.nome+' como sem interesse?')) return;
    const tipo=canal||(r==='nao_atendeu'?'ligacao':ehCel(fone(c))?'whatsapp':'ligacao');
    await reg(tipo,r,(nota&&nota.value.trim())||RES[r],r==='retorno'?ret.value:null);
  });
}

function campo([k,l,t='txt',op,full],v){
  const c = full ? ' full' : '';
  if(t==='sel'){ const L=v&&!OP[op].some(o=>o[0]===v)?[...OP[op],[v,v]]:OP[op];   // valor fora da lista continua salvo
    return `<label class="f${c}">${l}<select class="in" name="${k}"><option value=""></option>${L.map(o=>`<option value="${esc(o[0])}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`; }
  if(t==='area') return `<label class="f${c}">${l}<textarea class="in" name="${k}" rows="3">${esc(v)}</textarea></label>`;
  if(t==='bool') return `<label class="f${c}">${l}<select class="in" name="${k}"><option value="false" ${v?'':'selected'}>Não</option><option value="true" ${v?'selected':''}>Sim</option></select></label>`;
  const ty = t==='date'?'date':t==='num'?'number" step="any':t==='dtl'?'datetime-local':'text';
  let val = v; if(t==='dtl'&&v) val = new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  return `<label class="f${c}">${l}<input class="in" type="${ty}" name="${k}" value="${esc(val)}"></label>`;
}
function ler(form,tab){
  const o={}; for(const [k,,t] of F[tab]){ let v=form.elements[k].value;
    if(v===''){ o[k]=null; continue; }
    if(t==='num') v=Number(v); if(t==='bool') v=(v==='true'); if(t==='dtl') v=new Date(v).toISOString();
    o[k]=v; } return o;
}

// o: {topo: html antes do formulário, recolhido: formulário dentro de "Editar dados", semApagar}
function gaveta(tab,reg,titulo,depois,extraHtml='',o={}){
  fecha();
  const sh=document.createElement('div'); sh.className='shade'; sh.onclick=fecha;
  const d=document.createElement('div'); d.className='drawer';
  const form=`<form class="grid" id="fEd">${F[tab].map(f=>campo(f,reg[f[0]])).join('')}</form>`;
  d.innerHTML=`<h2>${esc(titulo)}</h2>${o.topo||''}${o.recolhido?`<details class="ed"><summary>Editar dados</summary>${form}</details>`:form}${extraHtml}`;
  const a=document.createElement('div'); a.className='actions';
  a.innerHTML=`<button class="btn" id="bSalva">Salvar</button><button class="btn sec" id="bFecha">Fechar</button>${reg.id&&!o.semApagar?'<button class="btn del" id="bApaga" style="margin-left:auto">Apagar</button>':''}`;
  document.body.append(sh,d,a);
  $('#bFecha').onclick=fecha;
  $('#bSalva').onclick=async()=>{
    const dados=ler($('#fEd'),tab);
    const q = reg.id ? sb.from(tab).update(dados).eq('id',reg.id) : (tab==='ranking_semanal' ? sb.from(tab).upsert(dados) : sb.from(tab).insert(dados));
    const {error}=await q; if(error) return toast('Erro: '+error.message);
    toast('Salvo'); fecha(); depois&&depois();
  };
  if(reg.id&&!o.semApagar) $('#bApaga').onclick=async()=>{ if(!confirm('Apagar este registro?')) return; const {error}=await sb.from(tab).delete().eq('id',reg.id); if(error) return toast('Erro: '+error.message); toast('Apagado'); fecha(); depois&&depois(); };
  return d;
}

const CONVERSA=['decisor','interessado','proposta','retorno','sem_interesse','cliente'];
function intervalo(k,a,b){
  const d=new Date(); d.setHours(0,0,0,0); let ini, fim=new Date(d);
  const seg=x=>{ const y=new Date(x); y.setDate(y.getDate()-((y.getDay()+6)%7)); return y; };
  if(k==='semana') ini=seg(d);
  else if(k==='semana_ant'){ ini=seg(d); ini.setDate(ini.getDate()-7); fim=new Date(ini); fim.setDate(fim.getDate()+6); }
  else if(k==='mes') ini=new Date(d.getFullYear(),d.getMonth(),1);

async function simples(tab,titulo,ordem,asc,colunas,novoPadrao,tituloReg){
  const v=$('#view');
  v.innerHTML=`<div class="bar"><h2>${titulo}</h2><button class="btn" id="novo">+ Adicionar</button></div><div id="lista"></div>`;
  const carrega=async()=>{
    const {data,error}=await sb.from(tab).select('*').order(ordem,{ascending:asc}); if(error) return toast(error.message);
    $('#lista').innerHTML=`<div class="count">${data.length} registro(s)</div><div class="tw"><table><thead><tr>${colunas.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${
      data.map((r,i)=>`<tr data-i="${i}">${colunas.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    $('#lista tbody').onclick=e=>{ const tr=e.target.closest('tr'); const r=data[tr.dataset.i]; gaveta(tab,r,tituloReg(r),carrega); };
  };
  $('#novo').onclick=()=>gaveta(tab,novoPadrao(),'Adicionar',carrega);
  carrega();
}

  $('#fCanalC').onclick=e=>{ const b=e.target.closest('[data-c]'); if(!b) return; canal=b.dataset.c; desenha(); };

  ids.forEach(k=>$('#'+k)[k==='fq'?'oninput':'onchange']=desenha);
  $('#fLimpa').onclick=()=>{ tipo=''; canal=''; ids.forEach(k=>$('#'+k).value=''); desenha(); };

  <div class="tw"><table><thead><tr><th>#</th><th>Empresa</th><th class="n">Índice</th>${D.map(x=>`<th class="n" title="peso ${x.peso}">${esc(x.dimensao.split(' (')[0])}</th>`).join('')}<th class="n">Cobertura</th></tr></thead><tbody>${

/* ---------- Visitantes: comportamento no site ----------
   O Google Analytics diz quantos. Esta aba diz o quê: a sequência de passos de
   cada visita, e principalmente quem começou a montar um orçamento e não enviou.
   Restrita ao administrador — o banco recusa a leitura para o resto da equipe. */
const VIS_PERIODOS=[[1,'Hoje'],[7,'7 dias'],[30,'30 dias'],[90,'90 dias']];
let VIS_DIAS=7, VIS_DADOS=null;
/* Laranja da marca e um azul: o par passa na checagem de daltonismo, que o
   laranja com o verde do painel não passava (vermelho e verde se confundem). */
const VIS_COR={visitas:'#CE581A',contatos:'#3F6EA8'};
const VIS_ROT={sessao_inicio:'Entrou no site',pagina_vista:'Viu a página',rolagem:'Rolou a página',pulso:'Continuou na página',saida_pagina:'Saiu da página',whatsapp_clique:'Clicou no WhatsApp',telefone_clique:'Clicou no telefone',email_clique:'Clicou no e-mail',cta_clique:'Clicou no botão',link_externo:'Saiu para um link externo',orcamento_iniciado:'Começou a montar o orçamento',orcamento_campo:'Preencheu o orçamento',duvida_abriu:'Abriu uma dúvida'};
/* Ruído de fundo: mede tempo e leitura, mas polui a linha do tempo. */
const VIS_FUNDO={pulso:1,rolagem:1,saida_pagina:1};
const visEvRot=n=>VIS_ROT[n]||n;
const visSegs=s=>s<=0?'0s':s<60?Math.round(s)+'s':s<3600?Math.floor(s/60)+'min '+Math.round(s%60)+'s':Math.floor(s/3600)+'h '+Math.round(s%3600/60)+'min';
const visMediana=a=>{ if(!a.length) return 0; const o=[...a].sort((x,y)=>x-y), m=o.length>>1; return o.length%2?o[m]:(o[m-1]+o[m])/2; };
const visContaPor=(itens,f)=>{ const m=new Map(); itens.forEach(i=>{ const k=f(i); if(k) m.set(k,(m.get(k)||0)+1); }); return [...m].map(([rotulo,total])=>({rotulo,total})).sort((a,b)=>b.total-a.total); };
const visBarras=(linhas,lim)=>{ const L=linhas.slice(0,lim||8); if(!L.length) return '<p class="mute">Sem dados no período.</p>';
  const max=Math.max(1,...L.map(l=>l.total));
  return `<div class="bars">${L.map(l=>`<div class="brow"><span title="${esc(l.rotulo)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.rotulo)}</span><i style="width:${Math.max(l.total/max*100,2)}%"></i><span class="n">${l.total}</span></div>`).join('')}</div>`; };

async function visitantes(){
  const v=$('#view');
  if(PAPEL!=='admin'){
    v.innerHTML='<div class="card alerta"><h3>Área restrita</h3><p class="mute">O rastreamento de visitantes é exclusivo do administrador. O banco também recusa a leitura, então não adianta insistir por aqui.</p></div>';
    return;
  }
  v.innerHTML='<p class="mute">Carregando…</p>';

  const desde=new Date(Date.now()-VIS_DIAS*864e5).toISOString();
  const [ev,se]=await Promise.all([
    sb.from('site_eventos').select('*').gte('criado_em',desde).order('criado_em',{ascending:false}).limit(20000),
    sb.from('site_sessoes').select('*').gte('iniciada_em',desde).order('iniciada_em',{ascending:false}).limit(20000)
  ]);
  if(ev.error||se.error){ v.innerHTML=`<div class="card alerta"><h3>Não deu para carregar</h3><p class="mute">${esc((ev.error||se.error).message)}</p></div>`; return; }

  const E=ev.data||[], S=se.data||[];
  VIS_DADOS={E,S};

  /* Agrupa por visita: quase tudo que interessa é por sessão, não por evento. */
  const porSessao=new Map();
  E.forEach(e=>{ if(!porSessao.has(e.sessao_id)) porSessao.set(e.sessao_id,[]); porSessao.get(e.sessao_id).push(e); });
  porSessao.forEach(l=>l.sort((a,b)=>new Date(a.criado_em)-new Date(b.criado_em)));

  const infoSessao=new Map(S.map(s=>[s.id,s]));
  const temNome=(l,n)=>l.some(e=>e.nome===n);
  const visDuracao=l=>l.length<2?0:(new Date(l[l.length-1].criado_em)-new Date(l[0].criado_em))/1000;

  const visitas=[...porSessao.entries()].map(([id,l])=>({
    id, eventos:l, sessao:infoSessao.get(id)||null, visitante:l[0].visitante_id,
    inicio:l[0].criado_em, fim:l[l.length-1].criado_em, duracao:visDuracao(l),
    paginas:l.filter(e=>e.nome==='pagina_vista').length,
    contatou:temNome(l,'whatsapp_clique')||temNome(l,'telefone_clique'),
    comecou:temNome(l,'orcamento_iniciado')
  })).sort((a,b)=>new Date(b.fim)-new Date(a.fim));

  const nVisitantes=new Set([...S.map(s=>s.visitante_id),...E.map(e=>e.visitante_id)]).size;
  const nContato=visitas.filter(x=>x.contatou).length;
  const nComecou=visitas.filter(x=>x.comecou).length;
  const abandonos=visitas.filter(x=>x.comecou&&!x.contatou);
  const umaPagina=visitas.filter(x=>x.paginas<=1).length;

  /* Série diária contínua: dia sem visita é zero, não buraco. */
  const dias=[];
  for(let i=VIS_DIAS-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); dias.push({dia:iso(d),visitas:0,contatos:0}); }
  const porDia=new Map(dias.map(d=>[d.dia,d]));
  const sessoesDoDia=new Map();
  E.forEach(e=>{ const k=iso(new Date(e.criado_em)), d=porDia.get(k); if(!d) return;
    if(!sessoesDoDia.has(k)) sessoesDoDia.set(k,new Set());
    sessoesDoDia.get(k).add(e.sessao_id);
    if(e.nome==='whatsapp_clique'||e.nome==='telefone_clique') d.contatos++; });
  sessoesDoDia.forEach((s,k)=>{ porDia.get(k).visitas=s.size; });

  /* Funil por visita: interessa quantas avançaram, não quantos cliques houve. */
  const leu=visitas.filter(x=>x.eventos.some(e=>e.nome==='rolagem'&&Number(e.valor)>=50)).length;
  const funil=[['Entrou no site',visitas.length],['Leu metade da página',leu],['Começou o orçamento',nComecou],['Pediu contato',nContato]];
  const topo=visitas.length||1;

  const cta=visContaPor(E.filter(e=>e.nome==='cta_clique'||e.nome==='whatsapp_clique'),e=>e.rotulo);
  const duvidas=visContaPor(E.filter(e=>e.nome==='duvida_abriu'),e=>e.rotulo);
  const paginas=visContaPor(E.filter(e=>e.nome==='pagina_vista'),e=>e.caminho);
  const origens=visContaPor(S,s=>s.origem);
  const aparelhos=visContaPor(S,s=>s.dispositivo);

  const W=720,H=180,PL=34,PR=22,PB=22,PT=12;
  const maxY=Math.max(5,...dias.map(d=>Math.max(d.visitas,d.contatos)));
  const px=i=>PL+(dias.length<=1?(W-PL-PR)/2:i/(dias.length-1)*(W-PL-PR));
  const py=n=>PT+(H-PT-PB)-(n/maxY)*(H-PT-PB);
  const linha=k=>dias.map((d,i)=>`${px(i)},${py(d[k])}`).join(' ');
  const cada=Math.max(1,Math.ceil(dias.length/6));
  const grafico=`
    <div style="display:flex;gap:16px;margin-bottom:8px">
      <span class="small mute"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${VIS_COR.visitas};vertical-align:-1px"></span> Visitas</span>
      <span class="small mute"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${VIS_COR.contatos};vertical-align:-1px"></span> Pedidos de contato</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Visitas e pedidos de contato por dia">
      ${[0,maxY/2,maxY].map(t=>`<line x1="${PL}" x2="${W-PR}" y1="${py(t)}" y2="${py(t)}" stroke="#DCD6CD" stroke-width="1"/><text x="${PL-6}" y="${py(t)+4}" text-anchor="end" font-size="10" fill="#6E6861">${Math.round(t)}</text>`).join('')}
      ${dias.map((d,i)=>i%cada===0||i===dias.length-1?`<text x="${px(i)}" y="${H-6}" text-anchor="${i===0?'start':i===dias.length-1?'end':'middle'}" font-size="10" fill="#6E6861">${d.dia.slice(8)}/${d.dia.slice(5,7)}</text>`:'').join('')}
      <polyline points="${linha('visitas')}" fill="none" stroke="${VIS_COR.visitas}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${linha('contatos')}" fill="none" stroke="${VIS_COR.contatos}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dias.map((d,i)=>`<g><title>${d.dia.slice(8)}/${d.dia.slice(5,7)} · ${d.visitas} visita(s) · ${d.contatos} contato(s)</title><circle cx="${px(i)}" cy="${py(d.visitas)}" r="4" fill="${VIS_COR.visitas}" stroke="#fff" stroke-width="2"/><circle cx="${px(i)}" cy="${py(d.contatos)}" r="4" fill="${VIS_COR.contatos}" stroke="#fff" stroke-width="2"/><rect x="${px(i)-10}" y="${PT}" width="20" height="${H-PT-PB}" fill="transparent"/></g>`).join('')}
    </svg>`;

  v.innerHTML=`
  <div class="bar"><h2>Visitantes</h2>
    ${VIS_PERIODOS.map(([d,l])=>`<button class="chip ${d===VIS_DIAS?'on':''}" data-dias="${d}">${l}</button>`).join('')}
    <button class="btn sec" id="visCsv">Baixar eventos</button>
  </div>

  <div class="kpis">
    <div class="kpi"><b>${nVisitantes}</b><small>pessoas diferentes</small></div>
    <div class="kpi"><b>${visitas.length}</b><small>visitas</small></div>
    <div class="kpi"><b>${E.filter(e=>e.nome==='pagina_vista').length}</b><small>páginas vistas</small></div>
    <div class="kpi"><b>${nContato}</b><small>visitas que pediram contato</small></div>
    <div class="kpi"><b>${visitas.length?Math.round(nContato/visitas.length*100):0}%</b><small>taxa de contato</small></div>
    <div class="kpi"><b>${abandonos.length}</b><small>começaram o orçamento e não enviaram</small></div>
    <div class="kpi"><b>${visSegs(visMediana(visitas.map(x=>x.duracao)))}</b><small>tempo típico da visita</small></div>
    <div class="kpi"><b>${visitas.length?Math.round(umaPagina/visitas.length*100):0}%</b><small>saíram na primeira página</small></div>
  </div>

  <div class="card"><h3>Visitas e pedidos de contato por dia</h3>${grafico}</div>

  <div class="cols2">
    <div class="card"><h3>Do primeiro clique ao contato</h3>
      <div class="bars">${funil.map(([rot,n])=>`<div class="brow"><span>${rot}</span><i style="width:${Math.max(n/topo*100,1.5)}%"></i><span class="n">${n}</span></div>`).join('')}</div>
      <p class="dica">Cada etapa conta visitas, não cliques.</p></div>
    <div class="card"><h3>De onde vieram</h3>${visBarras(origens)}</div>
    <div class="card"><h3>Páginas mais vistas</h3>${visBarras(paginas)}</div>
    <div class="card"><h3>Em que aparelho</h3>${visBarras(aparelhos,4)}</div>
    <div class="card"><h3>Botões mais clicados</h3>${visBarras(cta)}</div>
    <div class="card"><h3>Dúvidas mais abertas</h3>${visBarras(duvidas)}
      <p class="dica">O que as pessoas abrem é o que falta explicar na página.</p></div>
  </div>

  <div class="card"><h3>Começaram o orçamento e não enviaram</h3>
    ${abandonos.length?`<div class="tw"><table><thead><tr><th>Quando</th><th>Origem</th><th>Página</th><th>O que já tinha preenchido</th><th class="n">Tempo</th></tr></thead><tbody>
      ${abandonos.slice(0,40).map(x=>{ const ult=[...x.eventos].reverse().find(e=>e.nome==='orcamento_campo');
        const campos=ult&&ult.detalhes?Object.entries(ult.detalhes).map(([k,val])=>k+': '+val).join(' · '):'começou e parou no primeiro campo';
        const pag=[...x.eventos].reverse().find(e=>e.nome==='orcamento_iniciado');
        return `<tr data-vis="${esc(x.id)}"><td>${dth(x.inicio)}</td><td>${esc(x.sessao&&x.sessao.origem||'—')}</td><td class="small">${esc(pag?pag.caminho:'—')}</td><td class="small">${esc(campos)}</td><td class="n">${visSegs(x.duracao)}</td></tr>`; }).join('')}
    </tbody></table></div><p class="dica">Clique numa linha para ver a visita passo a passo.</p>`
    :'<p class="mute">Ninguém abandonou o orçamento no período.</p>'}</div>

  <div class="card"><h3>Visitas, uma por uma</h3>
    <div class="bar" style="margin-bottom:10px"><input class="in" id="visBusca" placeholder="Filtrar por origem, página, aparelho ou código" style="min-width:260px"></div>
    <div class="tw"><table><thead><tr><th>Quando</th><th>Origem</th><th>Aparelho</th><th class="n">Páginas</th><th class="n">Tempo</th><th>Situação</th></tr></thead><tbody id="visLinhas"></tbody></table></div>
    <p class="dica">Clique numa visita para ver a sequência exata de passos.</p></div>`;

  const desenhaLinhas=filtro=>{
    const f=(filtro||'').trim().toLowerCase();
    const L=visitas.filter(x=>{ if(!f) return true;
      const s=x.sessao||{};
      return [s.origem,s.dispositivo,s.navegador,s.sistema,x.visitante,x.id,...x.eventos.map(e=>e.caminho+' '+(e.rotulo||''))].join(' ').toLowerCase().includes(f); });
    $('#visLinhas').innerHTML=L.slice(0,120).map(x=>`<tr data-vis="${esc(x.id)}">
      <td>${dth(x.inicio)}</td><td>${esc(x.sessao&&x.sessao.origem||'—')}</td>
      <td class="small">${esc(x.sessao&&x.sessao.dispositivo||'—')}</td>
      <td class="n">${x.paginas}</td><td class="n">${visSegs(x.duracao)}</td>
      <td>${x.contatou?'<span class="pill p-ok">pediu contato</span>':x.comecou?'<span class="pill p-novo">começou o orçamento</span>':''}</td></tr>`).join('')
      ||'<tr><td colspan="6" class="mute">Nenhuma visita com esse filtro.</td></tr>';
  };
  desenhaLinhas('');

  $('#visBusca').oninput=e=>desenhaLinhas(e.target.value);
  v.querySelectorAll('[data-dias]').forEach(b=>b.onclick=()=>{ VIS_DIAS=Number(b.dataset.dias); visitantes(); });
  $('#visCsv').onclick=()=>visBaixaCsv('visitantes',E);
  v.onclick=e=>{ const tr=e.target.closest('[data-vis]'); if(!tr) return;
    const x=visitas.find(y=>y.id===tr.dataset.vis); if(x) abreVisita(x); };
}

/* Linha do tempo de uma visita: o passo a passo que o Analytics não mostra. */
function abreVisita(x){
  fecha();
  const s=x.sessao||{}, t0=new Date(x.inicio).getTime();
  /* No preenchimento do orçamento o rótulo é o último campo mexido e o valor é a
     contagem de campos — dado interno, que só atrapalha quem lê a linha do tempo. */
  const detalhe=e=>{
    const p=[];
    if(e.nome==='orcamento_campo'){ if(e.rotulo) p.push('último campo: '+e.rotulo); }
    else if(e.rotulo) p.push(e.rotulo);
    if(e.detalhes) for(const k in e.detalhes){ const val=e.detalhes[k]; if(val!==null&&val!=='') p.push(k.replace(/_/g,' ')+': '+val); }
    if(e.valor!=null&&e.nome!=='orcamento_campo') p.push(e.nome==='rolagem'?'leu '+e.valor+'% da página':'valor: '+e.valor);
    return p.join(' · ');
  };
  const passos=fundo=>x.eventos.filter(e=>fundo||!VIS_FUNDO[e.nome]).map(e=>{
    const dif=Math.round((new Date(e.criado_em)-t0)/1000);
    return `<li style="margin-bottom:10px"><b>${esc(visEvRot(e.nome))}</b>
      <span class="small mute">${new Date(e.criado_em).toLocaleTimeString('pt-BR')} · +${visSegs(dif)}</span><br>
      <span class="small mute">${esc(e.caminho||'')}</span>${detalhe(e)?`<br><span class="small">${esc(detalhe(e))}</span>`:''}</li>`;
  }).join('');

  document.body.insertAdjacentHTML('beforeend',`<div class="shade"></div><aside class="drawer">
    <h2>Visita de ${dth(x.inicio)}</h2>
    <p class="small mute">${esc(s.origem||'origem desconhecida')} · ${esc(s.dispositivo||'?')} · ${esc(s.navegador||'')} ${esc(s.sistema||'')}<br>
      ${x.paginas} página(s) · ${visSegs(x.duracao)} · visitante <code>${esc(String(x.visitante).slice(0,8))}</code></p>
    ${s.utm_campaign?`<p class="small">Campanha: ${esc(s.utm_campaign)} (${esc(s.utm_medium||'')})</p>`:''}
    <label class="small" style="display:block;margin:12px 0"><input type="checkbox" id="visFundo"> mostrar rolagem e tempo</label>
    <ol id="visPassos" style="padding-left:18px">${passos(false)}</ol>
  </aside>
  <div class="actions"><button class="btn sec" id="visFecha">Fechar</button></div>`);

  $('#visFecha').onclick=fecha;
  document.querySelector('.shade').onclick=fecha;
  $('#visFundo').onchange=e=>{ $('#visPassos').innerHTML=passos(e.target.checked); };
}

/* CSV com BOM, para o Excel em português abrir os acentos certos. */
function visBaixaCsv(nome,linhas){
  if(!linhas.length) return toast('Nada para baixar.');
  const cols=[...new Set(linhas.flatMap(l=>Object.keys(l)))];
  const cel=v=>'"'+String(v==null?'':typeof v==='object'?JSON.stringify(v):v).replace(/"/g,'""')+'"';
  const csv=[cols.join(',')].concat(linhas.map(l=>cols.map(c=>cel(l[c])).join(','))).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿',csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=nome+'-'+hoje()+'.csv'; a.click(); URL.revokeObjectURL(url);
}

/* ---------- Login ---------- */
$('#fLogin').onsubmit=async e=>{
  e.preventDefault(); $('#lErr').textContent='';
  const u=e.target.u.value.trim().toLowerCase(), s=e.target.s.value;
  const email = u.includes('@') ? u : u+DOM;
  const {error}=await sb.auth.signInWithPassword({email,password:s});
  if(error) $('#lErr').textContent='Usuário ou senha incorretos.';
};
async function carregaPapel(){
  const {data}=await sb.from('equipe').select('papel').ilike('email',EU).maybeSingle();
  PAPEL=(data&&data.papel)||'equipe';
}
$('#sair').onclick=()=>sb.auth.signOut();
$('#pedRap').onclick=()=>pedidoRapido();
// O Supabase repete o evento de login quando a aba volta ao foco (ex.: depois de abrir o WhatsApp).
// Só desenha no primeiro login, senão a tela recarrega e perde gaveta aberta, anotações e filtros.
let iniciado=false;
sb.auth.onAuthStateChange((_ev,session)=>{
  const on=!!session;
  $('#login').classList.toggle('hide',on); $('#app').classList.toggle('hide',!on);
  if(!on){ iniciado=false; return; }
  EU=session.user.email; $('#who').textContent=EU.split('@')[0];
  if(!iniciado){ iniciado=true; carregaPapel().then(render); }
});
</script>
